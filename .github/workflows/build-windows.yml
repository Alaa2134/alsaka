name: Build Windows Installer

on:
  push:
    branches:
      - claude/systemalaa-desktop-app-YK5q1
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # electron-builder's postinstall (install-app-deps) already
      # rebuilds native modules against the Electron ABI shipped in
      # this project. No extra rebuild step needed.
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Force-rebuild better-sqlite3 against Electron 33's ABI. The
      # default `npm install` pulls a Node.js-ABI prebuilt and the
      # electron-builder postinstall doesn't always replace it on CI,
      # leaving the packaged app with a binary that crashes silently
      # because the NODE_MODULE_VERSION doesn't match Electron's V8.
      - name: Rebuild better-sqlite3 for Electron ABI
        working-directory: desktop
        run: npx --yes @electron/rebuild -f -w better-sqlite3 --module-dir .

      # Verify the rebuilt binary's NODE_MODULE_VERSION matches Electron
      # 33 (NMV 130). If it doesn't, fail the build now rather than
      # shipping a broken installer.
      - name: Verify native ABI
        working-directory: desktop
        shell: pwsh
        run: |
          $node = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (-not (Test-Path $node)) { throw "binary missing: $node" }
          $mtime = (Get-Item $node).LastWriteTime
          Write-Host "Binary timestamp: $mtime"
          # Strings the binary for the embedded electron napi marker
          $hasNapi = (Select-String -Path $node -Pattern "napi" -SimpleMatch -Quiet)
          Write-Host "Has napi marker:  $hasNapi"
          if ($mtime -lt (Get-Date).AddHours(-1)) {
            throw "better_sqlite3.node was not freshly rebuilt — it's still the cached prebuilt"
          }
          Write-Host "OK — binary is freshly built for the current Electron"

      - name: Build Windows installer (NSIS .exe)
        working-directory: desktop
        run: npm run dist:win
        env:
          # Skip code-signing for now (no certificate). The .exe will
          # still install but Windows SmartScreen may warn the user.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Verbose electron-builder logs in case it fails again
          DEBUG: 'electron-builder'

      - name: List output
        working-directory: desktop/release
        run: dir
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSystem-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Publish (or update) a "latest" prerelease so end users get a
      # stable, public download URL that always points to the most
      # recent successful build. This is what gets shared with merchants.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/claude/systemalaa-desktop-app-YK5q1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Horus System — Latest Build"
          body: |
            Auto-built from commit ${{ github.sha }}.

            Download `Horus.System.Setup.1.0.0.exe` below, double-click,
            and follow the install wizard. The app launches automatically
            after install. No prerequisites required.

            First-run login:
            - Email: `admin@horus.app` or `admin@systemalaa.app`
            - Password: `admin`
          prerelease: true
          make_latest: false
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml

      # Tag-driven release (for stable versioned releases later)
      - name: Create tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          generate_release_notes: true
