name = "horus-vendor"
main = "worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 (edge SQLite) — `wrangler d1 create horus-vendor` and copy the id.
[[d1_databases]]
binding = "DB"
database_name = "horus-vendor"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# R2 (for hosting signed .exe releases)
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "horus-releases"

# Secrets — set with `wrangler secret put`:
#   VENDOR_SECRET      — identical to desktop/electron/licensing.cjs HMAC
#   ADMIN_PASSWORD_HASH — sha256 of the admin password
#   JWT_SECRET         — random 32 bytes
